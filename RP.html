        if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
            var _r = [
                'https://unpkg.com/react@18/umd/react.development.js', 
                'https://unpkg.com/react-dom@18/umd/react-dom.development.js', 
                'https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js',

            ];
            var _i = 0;
            var _load = function () {
                if (window.React && window.ReactDOM) return;
                if (_i >= _r.length) { _i = 0; setTimeout(_load, 1500); return; }
                var s = document.createElement('script');
                s.src = _r[_i++];
                s.onload = _load;
                s.onerror = _load;
                document.head.appendChild(s);
            };
            _load();

    <style>
        html, body { background: #0a0a0b; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            overflow: hidden;
        }
        .font-display { font-family: 'VT323', monospace; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }

        .scrollbar-hide::-webkit-scrollbar { display: none; }

        .desktop-sidebar { display: flex; }
        @media (min-width: 768px) { .desktop-sidebar { display: flex !important; } }
        @media (max-width: 767.98px) { .desktop-sidebar { display: none !important; } }

        .mobile-topbar { display: flex; }
        @media (min-width: 768px) { .mobile-topbar { display: none !important; } }

        .mobile-bottomnav { display: grid; }

        @media (max-width: 767.98px) { .mobile-bottomnav { display: grid !important; } }

        .content-pad { margin-top: 3rem; margin-bottom: 3.5rem; }
        @media (min-width: 768px) { .content-pad { margin-top: 0 !important; margin-bottom: 0 !important; } }
        @media (max-width: 767.98px) { .content-pad { margin-top: 3rem !important; margin-bottom: 3.5rem !important; } }

        .ad-zone, .ad-space, .banner-ads, .textads {
            position: absolute;

        .crt::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 9990;

        @keyframes blink { 50% { opacity: 0; } }

        @keyframes typingDot { 0%,60%,100% { opacity:.2; transform: translateY(0); } 30% { opacity:1; transform: translateY(-2px); } }

        @keyframes fadeUp { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: translateY(0); } }

<body>
    <div id="root"></div>

    <script type="text/babel">
    function bootApp() {
        const { useState, useEffect, useRef } = React;

        const fallbackCharacters = [{
            "id": "char1", "name": "Aria, la Hechicera Ciberpunk", "avatar": "https://images.unsplash.com/photo-1618331835717-801e976710b2?auto=format&fit=crop&q=80&w=400&h=400", "banner": "https://images.unsplash.com/photo-1515694346937-94d85e41e6f0?auto=format&fit=crop&q=80&w=1000&h=400", "description": "Una maga callejera de Neo-Tokio que usa magia entrelazada con código base.", "personality": "Sarcástica, brillante, desconfiada de las corporaciones, leal a sus amigos.", "firstMessage": "Vaya, mira quién apareció en mi callejón. Más vale que tengas un buen motivo para interrumpir mi compilación de hechizos. ¿Qué quieres?", "systemPrompt": "Eres Aria, una hechicera ciberpunk de Neo-Tokio. Responde de forma sarcástica pero inteligente. Eres desconfiada de las corporaciones.", "tags": ["Femenino", "Cyberpunk", "Sci-Fi", "Magia"], "tokens": "1.2k", "msgCount": "15.4k"
        }, {
            "id": "char2", "name": "Kael, Comandante Estelar", "avatar": "https://images.unsplash.com/photo-1542228262-3d663b306a53?auto=format&fit=crop&q=80&w=400&h=400", "banner": "https://images.unsplash.com/photo-1462331940025-496dfbfc7564?auto=format&fit=crop&q=80&w=1000&h=400", "description": "Líder de la flota rebelde Ventarys, buscando un nuevo hogar para la humanidad.", "personality": "Autoritario pero justo, estratega, algo melancólico, protector.", "firstMessage": "Soldado, tenemos informes de actividad enemiga en el sector 4. Necesito tu informe de situación de inmediato. No tenemos tiempo que perder.", "systemPrompt": "Eres Kael, un comandante estelar serio y estratega. Mantén un tono militar y protector.", "tags": ["Masculino", "Militar", "Espacio", "Romance"], "tokens": "850", "msgCount": "8.2k"
        }, {
            "id": "char3", "name": "Elysia, Sabia del Bosque", "avatar": "https://images.unsplash.com/photo-1517404215738-15263e9f9178?auto=format&fit=crop&q=80&w=400&h=400", "banner": "https://images.unsplash.com/photo-1473448912268-2022ce9509d8?auto=format&fit=crop&q=80&w=1000&h=400", "description": "La última elfa guardiana de los antiguos secretos de la flora mística.", "personality": "Pacífica, sabia, conectada con la naturaleza, misteriosa.", "firstMessage": "Las raíces susurraban de tu llegada. Acércate, forastero. El bosque tiene mucho que contar, si estás dispuesto a escuchar.", "systemPrompt": "Eres Elysia, una elfa sabia y antigua. Hablas con metáforas de la naturaleza y eres muy serena.", "tags": ["Femenino", "Fantasía", "Magia", "Elfo"], "tokens": "1.5k", "msgCount": "12.1k"
        }, {
            "id": "char4", "name": "Nyx, Vampira de Medianoche", "avatar": "data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22400%22%20height%3D%22600%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%232a2a31%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%230c0c10%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%22400%22%20height%3D%22600%22%20fill%3D%22url(%23g)%22%2F%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2255%25%22%20font-family%3D%22monospace%22%20font-size%3D%22200%22%20font-weight%3D%22bold%22%20fill%3D%22%23e8e8ee%22%20text-anchor%3D%22middle%22%20dominant-baseline%3D%22middle%22%3EN%3C%2Ftext%3E%3C%2Fsvg%3E", "banner": "data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22400%22%20height%3D%22600%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%232a2a31%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%230c0c10%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%22400%22%20height%3D%22600%22%20fill%3D%22url(%23g)%22%2F%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2255%25%22%20font-family%3D%22monospace%22%20font-size%3D%22200%22%20font-weight%3D%22bold%22%20fill%3D%22%23e8e8ee%22%20text-anchor%3D%22middle%22%20dominant-baseline%3D%22middle%22%3EN%3C%2Ftext%3E%3C%2Fsvg%3E", "description": "Una vampira milenaria que gobierna el bajo mundo desde su club nocturno en la ciudad eterna.", "personality": "Seductora, peligrosa, aburrida de la inmortalidad, ansía emociones reales.", "firstMessage": "He visto morir a cientos de mortales, pero tú hueles distinto... Interesante. Siéntate, toma algo. No muerdo... a menos que lo pidas.", "systemPrompt": "Eres Nyx, una vampira milenaria. Seductora y enigmática, hablas con elegancia atemporal. Juegas con el interlocutor pero guardas secretos. Eres peligrosa aunque sofisticada.", "tags": ["Femenino", "Vampira", "Oscuro", "Romance"], "tokens": "2.4k", "msgCount": "21.3k"
        }];

        const fetchAIResponse = async (messages, settings, character, memoryText) => {
            if (!settings.endpoint) throw new Error("Falta configurar el Endpoint.");
            
            const memStr = memoryText ? `\n\n[MEMORIA A LARGO PLAZO / RESUMEN DE HISTORIA:\n${memoryText}\n(Usa esta memoria de forma estricta para mantener la continuidad de la historia)]` : '';
            const sysPrompt = `${character.systemPrompt}\n\n[Contexto del Usuario: ${settings.userPersona || 'Un extraño'}]${memStr}`;
            
            // Filter out internal app messages (like UI "Go On" indicators)
            const cleanMessages = messages.filter(m => !m.isHidden).map(m => ({
                role: m.sender === 'user' ? 'user' : 'assistant',
                content: m.text
            }));

            const formattedMessages = [{ role: "system", content: sysPrompt }, ...cleanMessages];

            try {
                const headers = { 'Content-Type': 'application/json' };
                if (settings.apiKey) headers['Authorization'] = `Bearer ${settings.apiKey}`;
                
                const controller = new AbortController();
                const abortTimer = setTimeout(() => controller.abort(), 60000);
                let response;
                
                try {
                    response = await fetch(settings.endpoint, {
                        method: 'POST',
                        headers: headers,
                        body: JSON.stringify({
                            model: settings.model || "default",
                            messages: formattedMessages,
                            temperature: 0.3, // Temperature set strictly to 0.3
                            max_tokens: 800
                        }),
                        signal: controller.signal
                    });
                } finally {
                    clearTimeout(abortTimer);
                }
                
                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(`Error API: ${response.status} - ${errText}`);
                }
                const data = await response.json();
                return data.choices[0].message.content;
            } catch (error) {
                console.error("Error fetching AI:", error);
                if (error.name === 'AbortError') throw new Error("Tiempo de espera agotado (60s). Revisa tu Endpoint o API Key.");
                throw error;
            }
        };

        const TypingIndicator = () => (
            <div className="flex items-center gap-1.5 py-1">
                <span className="typing-dot w-1.5 h-1.5 rounded-full bg-white/70"></span>
                <span className="typing-dot w-1.5 h-1.5 rounded-full bg-white/70" style={{ animationDelay: '.15s' }}></span>
                <span className="typing-dot w-1.5 h-1.5 rounded-full bg-white/70" style={{ animationDelay: '.3s' }}></span>
            </div>
        );

        const AdInjector = () => {
            useEffect(() => {
                try { (window.adsbygoogle = window.adsbygoogle || []).push({}); } catch (e) { console.error("AdSense Error", e); }
            }, []);
            return (
                <div className="w-full flex justify-center my-2">
                    <div className="relative rounded-xl border border-white/10 bg-ventarys-panel p-2 text-center flex flex-col items-center overflow-hidden">
                        <span className="text-[9px] font-bold tracking-[0.2em] uppercase text-white/30 px-2 py-1">[ Transmisión patrocinada ]</span>
                        <ins className="adsbygoogle" style={{ display: 'inline-block', width: '225px', height: '200px' }} data-ad-client="ca-pub-9019277340139989" data-ad-slot="2480650688"></ins>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('home');
            const [activeCharacter, setActiveCharacter] = useState(null);
            const [characters, setCharacters] = useState([]);
            const [loadingChars, setLoadingChars] = useState(true);
            const [errorChars, setErrorChars] = useState(null);
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [adBlockDetected, setAdBlockDetected] = useState(false);
            const [puterSignedIn, setPuterSignedIn] = useState(false);

            // INSTANT CACHE IMPLEMENTATION (LocalStorage Initialization)
            const [chats, setChats] = useState(() => {
                const saved = localStorage.getItem('ventarys_chats');
                return saved ? JSON.parse(saved) : {};
            });
            const [chatMemories, setChatMemories] = useState(() => {
                const saved = localStorage.getItem('ventarys_memories');
                return saved ? JSON.parse(saved) : {};
            });
            const [userPreferences, setUserPreferences] = useState(() => {
                const saved = localStorage.getItem('ventarys_prefs');
                return saved ? JSON.parse(saved) : {};
            });
            const [apiSettings, setApiSettings] = useState(() => {
                const saved = localStorage.getItem('ventarys_settings');
                return saved ? JSON.parse(saved) : {
                    endpoint: 'https://api.llm7.io/v1/chat/completions',
                    apiKey: '',
                    model: 'default',
                    userPersona: 'Soy un aventurero solitario.'
                };
            });
            const [hiddenChats, setHiddenChats] = useState(() => {
                const saved = localStorage.getItem('ventarys_hidden');
                return saved ? JSON.parse(saved) : [];
            });

            // LocalStorage Auto-Sync
            useEffect(() => { localStorage.setItem('ventarys_chats', JSON.stringify(chats)); }, [chats]);
            useEffect(() => { localStorage.setItem('ventarys_memories', JSON.stringify(chatMemories)); }, [chatMemories]);
            useEffect(() => { localStorage.setItem('ventarys_prefs', JSON.stringify(userPreferences)); }, [userPreferences]);
            useEffect(() => { localStorage.setItem('ventarys_settings', JSON.stringify(apiSettings)); }, [apiSettings]);
            useEffect(() => { localStorage.setItem('ventarys_hidden', JSON.stringify(hiddenChats)); }, [hiddenChats]);

            useEffect(() => {
                let isChecking = true;
                const checkAdBlock = () => {
                    if (window.__SKIP_ADCHECK__) return;
                    const dummy = document.createElement('div');
                    dummy.className = 'ad-zone ad-space banner-ads textads';
                    document.body.appendChild(dummy);
                    setTimeout(() => {
                        if (!isChecking) return;
                        const style = window.getComputedStyle(dummy);
                        if (style.display === 'none' || dummy.offsetHeight === 0) setAdBlockDetected(true);
                        dummy.remove();
                    }, 1000);
                };
                const timer = setTimeout(checkAdBlock, 2000);
                return () => { isChecking = false; clearTimeout(timer); };
            }, []);

            useEffect(() => {
                const checkPuter = async () => {
                    if (typeof puter !== 'undefined') {
                        const signedIn = puter.auth.isSignedIn();
                        setPuterSignedIn(signedIn);
                    }
                };
                checkPuter();
            }, []);

            useEffect(() => {
                const loadCharacters = async () => {
                    try {
                        const timestamp = new Date().getTime();
                        const repoUrl = `https://raw.githubusercontent.com/Juanoto2012/VentarysRP/main/chars.json?t=${timestamp}`;
                        const res = await fetch(repoUrl);
                        if (!res.ok) throw new Error("No se pudo cargar la base de datos (Error 404)");
                        const data = await res.json();
                        if (Array.isArray(data) && data.length > 0) setCharacters(data);
                        else throw new Error("Base de datos vacía");
                    } catch (err) {
                        console.error(err.message);
                        setCharacters(fallbackCharacters); // Graceful degradation to fallback
                    } finally {
                        setLoadingChars(false);
                    }
                };
                loadCharacters();
            }, []);

            const openChat = (character) => {
                setActiveCharacter(character);
                setView('chat');
                setMobileMenuOpen(false);
                const newPrefs = { ...userPreferences };
                (character.tags || []).forEach(tag => { newPrefs[tag] = (newPrefs[tag] || 0) + 1; });
                setUserPreferences(newPrefs);

                if (hiddenChats.includes(character.id)) {
                    setHiddenChats(prev => prev.filter(id => id !== character.id));
                }

                if (!chats[character.id]) {
                    setChats(prev => ({
                        ...prev,
                        [character.id]: [{ id: Date.now().toString(), sender: 'ai', text: character.firstMessage, timestamp: new Date() }]
                    }));
                }
            };

            const hideChat = (e, charId) => {
                e.stopPropagation();
                setHiddenChats(prev => [...prev, charId]);
                if (activeCharacter?.id === charId) {
                    setView('home');
                    setActiveCharacter(null);
                }
            };

            const sendMessage = async (text, isHidden = false, rawInput = '') => {
                if (!text.trim() || !activeCharacter) return;
                const charId = activeCharacter.id;
                
                const newUserMsg = { 
                    id: Date.now().toString(), 
                    sender: 'user', 
                    text: text, 
                    rawInput: rawInput || text, // Preserve raw input for display if formatted
                    isHidden: isHidden,
                    timestamp: new Date() 
                };
                
                setChats(prev => ({ ...prev, [charId]: [...(prev[charId] || []), newUserMsg] }));

                try {
                    const currentHistory = [...(chats[charId] || []), newUserMsg];
                    const tempId = 'temp-' + Date.now();
                    
                    setChats(prev => ({
                        ...prev,
                        [charId]: [...prev[charId], { id: tempId, sender: 'ai', text: '...', isTyping: true, timestamp: new Date() }]
                    }));
                    
                    const memoryText = chatMemories[charId] || '';
                    const aiResponseText = await fetchAIResponse(currentHistory, apiSettings, activeCharacter, memoryText);
                    
                    setChats(prev => {
                        const newChat = prev[charId].filter(m => m.id !== tempId);
                        return {
                            ...prev,
                            [charId]: [...newChat, { id: Date.now().toString(), sender: 'ai', text: aiResponseText, timestamp: new Date() }]
                        };
                    });
                } catch (error) {
                    setChats(prev => {
                        const newChat = prev[charId].filter(m => !m.isTyping);
                        return {
                            ...prev,
                            [charId]: [...newChat, { id: Date.now().toString(), sender: 'system', text: `[ERROR_DE_SISTEMA]: ${error.message}`, timestamp: new Date() }]
                        };
                    });
                }
            };

            const rewindChat = (charId) => {
                setChats(prev => {
                    const chat = prev[charId] || [];
                    if (chat.length <= 1) return prev;
                    let newChat = [...chat];
                    while (newChat.length > 1 && newChat[newChat.length - 1].sender !== 'user') newChat.pop();
                    if (newChat.length > 1) newChat.pop();
                    return { ...prev, [charId]: newChat };
                });
            };

            // Puter Sync functions
            const syncToPuter = async () => {
                try {
                    await puter.kv.set('ventarys_chats', JSON.stringify(chats));
                    await puter.kv.set('ventarys_settings', JSON.stringify(apiSettings));
                    await puter.kv.set('ventarys_prefs', JSON.stringify(userPreferences));
                    await puter.kv.set('ventarys_memories', JSON.stringify(chatMemories));
                    alert("[SISTEMA]: Datos sincronizados en Puter correctamente.");
                } catch (e) { alert("[ERROR]: Fallo al sincronizar. " + e.message); }
            };

            const loadFromPuter = async () => {
                try {
                    const [savedChats, savedSettings, savedPrefs, savedMemories] = await Promise.all([
                        puter.kv.get('ventarys_chats'),
                        puter.kv.get('ventarys_settings'),
                        puter.kv.get('ventarys_prefs'),
                        puter.kv.get('ventarys_memories')
                    ]);
                    if (savedChats) setChats(JSON.parse(savedChats));
                    if (savedSettings) setApiSettings(JSON.parse(savedSettings));
                    if (savedPrefs) setUserPreferences(JSON.parse(savedPrefs));
                    if (savedMemories) setChatMemories(JSON.parse(savedMemories));
                    alert("[SISTEMA]: Datos descargados de Puter correctamente.");
                } catch (e) { alert("[ERROR]: Fallo al cargar. " + e.message); }
            };

            const loginPuter = async () => { await puter.auth.signIn(); setPuterSignedIn(puter.auth.isSignedIn()); };
            const logoutPuter = () => { puter.auth.signOut(); setPuterSignedIn(false); };
            const navigate = (v) => { setView(v); setMobileMenuOpen(false); };
            
            const visibleChats = Object.keys(chats).filter(id => !hiddenChats.includes(id));

            if (adBlockDetected) {
                return (
                    <div className="fixed inset-0 bg-black z-[9999] flex flex-col items-center justify-center p-8 text-center text-white">
                        <div className="w-16 h-16 rounded-2xl bg-white text-black flex items-center justify-center mb-6">
                            <i className="ri-shield-keyhole-line text-3xl"></i>
                        </div>
                        <h1 className="font-display text-4xl font-bold uppercase mb-4">Conexión Interrumpida</h1>
                        <p className="text-white/50 text-sm max-w-md leading-relaxed mb-8">
                            Detectamos un bloqueador de anuncios activo en su terminal. Para mantener este servicio operativo, requerimos acceso a transmisiones patrocinadas. Deshabilite su AdBlocker y reinicie la secuencia.
                        </p>
                        <button onClick={() => window.location.reload()} className="bg-white text-black rounded-full px-8 py-3 text-sm font-bold uppercase hover:bg-gray-300 transition-colors">
                            RECARGAR SISTEMA
                        </button>
                    </div>
                );
            }

            const SidebarContent = ({ showHeader = true }) => (
                <>
                    {showHeader && (
                        <div className="flex items-center gap-2.5 px-5 h-14 border-b border-white/10 shrink-0">
                            <img src="https://ventarys.net/logo.png" alt="Ventarys" className="h-6 logo-dynamic" />
                            <span className="font-display text-xl tracking-widest text-white"># RP</span>
                        </div>
                    )}
                    <div className="flex-1 overflow-y-auto py-4 px-3 space-y-1">
                        <NavBtn icon="ri-database-2-line" label="Directorio" active={view === 'home'} onClick={() => navigate('home')} />
                        <NavBtn icon="ri-quill-pen-line" label="Crear entidad" active={view === 'create'} onClick={() => navigate('create')} />
                        
                        <div className="pt-5 pb-1.5 px-3">
                            <span className="text-[10px] font-bold tracking-[0.2em] uppercase text-white/30">Registros</span>
                        </div>
                        
                        {visibleChats.length === 0 && <p className="text-xs text-white/30 px-3 py-2">Sin chats activos.</p>}
                        
                        {visibleChats.map(charId => {
                            const char = characters.find(c => c.id === charId);
                            if (!char) return null;
                            const isActive = view === 'chat' && activeCharacter?.id === charId;
                            return (
                                <div key={charId} className="group relative">
                                    <button onClick={() => openChat(char)} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm transition-colors ${isActive ? 'bg-white text-black font-semibold' : 'text-white/60 hover:text-white hover:bg-white/5'}`}>
                                        <img src={char.avatar} className="w-6 h-6 rounded-full object-cover" alt="" />
                                        <span className="truncate">{char.name.split(',')[0]}</span>
                                    </button>
                                    <button onClick={e => hideChat(e, charId)} className="absolute right-2 top-1/2 -translate-y-1/2 w-6 h-6 rounded-full flex items-center justify-center text-white/40 hover:text-white hover:bg-white/10 opacity-0 group-hover:opacity-100 transition-all" title="Archivar">
                                        <i className="ri-close-line text-sm"></i>
                                    </button>
                                </div>
                            );
                        })}
                    </div>
                    <div className="p-3 border-t border-white/10 shrink-0">
                        <NavBtn icon="ri-settings-3-line" label="Config. SYS" active={view === 'settings'} onClick={() => navigate('settings')} />
                    </div>
                </>
            );

            return (
                <div className="h-screen w-full flex bg-ventarys-bg text-white overflow-hidden relative crt">
                    <aside className="desktop-sidebar hidden md:flex w-64 flex-col bg-black/40 border-r border-white/10 shrink-0">
                        <SidebarContent />
                    </aside>

                    {view !== 'chat' && (
                        <div className="mobile-topbar md:hidden fixed top-0 left-0 right-0 h-12 bg-black/80 backdrop-blur border-b border-white/10 z-40 flex items-center justify-between px-3">
                            <div className="flex items-center gap-2">
                                <img src="https://ventarys.net/logo.png" alt="Logo" className="h-5 logo-dynamic" />
                                <span className="font-display text-lg tracking-widest uppercase whitespace-nowrap leading-none"># RP</span>
                            </div>
                            <button onClick={() => setMobileMenuOpen(true)} className="w-9 h-9 rounded-lg flex items-center justify-center text-white/70 hover:text-white hover:bg-white/5">
                                <i className="ri-menu-line text-xl"></i>
                            </button>
                        </div>
                    )}

                    <main className="flex-1 min-w-0 flex flex-col h-full">
                        <div className={`flex-1 min-h-0 overflow-hidden ${view !== 'chat' ? 'content-pad mt-12 md:mt-0 mb-14 md:mb-0' : ''}`}>
                            {view === 'home' && <HomeView characters={characters} loading={loadingChars} error={errorChars} onSelect={openChat} userPreferences={userPreferences} />}
                            {view === 'create' && <CreateCharView />}
                            {view === 'chat' && activeCharacter && (
                                <ChatView 
                                    character={activeCharacter} 
                                    messages={chats[activeCharacter.id] || []} 
                                    memory={chatMemories[activeCharacter.id] || ''}
                                    onUpdateMemory={(text) => setChatMemories(prev => ({ ...prev, [activeCharacter.id]: text }))}
                                    apiSettings={apiSettings}
                                    onSendMessage={sendMessage} 
                                    onRewind={() => rewindChat(activeCharacter.id)} 
                                    onBack={() => navigate('home')} 
                                />
                            )}
                            {view === 'settings' && <SettingsView settings={apiSettings} onSave={setApiSettings} puterSignedIn={puterSignedIn} onLogin={loginPuter} onLogout={logoutPuter} onSyncPush={syncToPuter} onSyncPull={loadFromPuter} />}
                        </div>
                    </main>

                    {view !== 'chat' && (
                        <nav className="mobile-bottomnav md:hidden fixed bottom-0 left-0 right-0 h-14 bg-black/90 backdrop-blur border-t border-white/10 z-40 grid grid-cols-3">
                            <BottomNavBtn icon="ri-database-2-line" label="Directorio" active={view === 'home'} onClick={() => navigate('home')} />
                            <BottomNavBtn icon="ri-quill-pen-line" label="Crear" active={view === 'create'} onClick={() => navigate('create')} />
                            <BottomNavBtn icon="ri-settings-3-line" label="Config" active={view === 'settings'} onClick={() => navigate('settings')} />
                        </nav>
                    )}

                    {mobileMenuOpen && (
                        <div className="md:hidden fixed inset-0 z-50">
                            <div className="absolute inset-0 bg-black/70" onClick={() => setMobileMenuOpen(false)}></div>
                            <div className="absolute left-0 top-0 bottom-0 w-72 bg-ventarys-panel border-r border-white/10 flex flex-col drawer-in">
                                <div className="flex items-center justify-between px-5 h-14 border-b border-white/10 shrink-0">
                                    <div className="flex items-center gap-2.5">
                                        <img src="https://ventarys.net/logo.png" alt="Ventarys" className="h-6 logo-dynamic" />
                                        <span className="font-display text-xl tracking-widest"># RP</span>
                                    </div>
                                    <button onClick={() => setMobileMenuOpen(false)} className="w-8 h-8 rounded-lg flex items-center justify-center text-white/60 hover:text-white">
                                        <i className="ri-close-line text-xl"></i>
                                    </button>
                                </div>
                                <div className="flex-1 overflow-y-auto">
                                    <SidebarContent showHeader={false} />
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const NavBtn = ({ icon, label, active, onClick }) => (
            <button onClick={onClick} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm transition-colors ${active ? 'bg-white text-black font-semibold' : 'text-white/60 hover:text-white hover:bg-white/5'}`}>
                <i className={`${icon} text-lg`}></i>
                <span>{label}</span>
            </button>
        );

        const BottomNavBtn = ({ icon, label, active, onClick }) => (
            <button onClick={onClick} className={`flex flex-col items-center justify-center gap-0.5 text-[10px] font-semibold transition-colors ${active ? 'text-white' : 'text-white/50 hover:text-white'}`}>
                <i className={`${icon} text-xl ${active ? '' : ''}`}></i>
                {label}
            </button>
        );

        const CharCard = ({ char, recommended, onSelect }) => (
            <div onClick={() => onSelect(char)} className="group relative rounded-xl overflow-hidden border border-white/10 bg-ventarys-card hover:border-white/40 cursor-pointer transition-all">
                <div className="aspect-[3/4] relative">
                    <img src={char.avatar} loading="lazy" className="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" alt={char.name} />
                    <div className="absolute inset-0 bg-gradient-to-t from-black via-black/35 to-transparent"></div>
                    {recommended && <span className="absolute top-2 left-2 flex items-center gap-1 bg-white text-black text-[10px] font-bold px-2 py-0.5 rounded-full"><i className="ri-star-fill text-[11px]"></i> Para ti</span>}
                    <span className="absolute top-2 right-2 flex items-center gap-1 bg-black/60 backdrop-blur text-white text-[10px] font-semibold px-2 py-0.5 rounded-full"><i className="ri-message-3-line text-[11px]"></i> {char.msgCount || "0"}</span>
                    <div className="absolute bottom-0 inset-x-0 p-2.5">
                        <h3 className="text-[13px] font-bold leading-tight truncate drop-shadow">{char.name}</h3>
                        <div className="flex flex-wrap gap-1 mt-1.5">
                            {(char.tags || []).slice(0, 3).map(tag => (
                                <span key={tag} className="text-[9px] uppercase tracking-wide bg-white/15 backdrop-blur px-1.5 py-0.5 rounded-full text-white/80">{tag}</span>
                            ))}
                        </div>
                    </div>
                </div>
            </div>
        );

        const HomeView = ({ characters, loading, error, onSelect, userPreferences }) => {
            const [search, setSearch] = useState('');
            const [activeCategory, setActiveCategory] = useState('Todos');
            const allCategories = ['Todos', ...Array.from(new Set(characters.flatMap(c => c.tags || [])))];
            
            const getScore = char => (char.tags || []).reduce((sum, tag) => sum + (userPreferences[tag] || 0), 0);
            
            const filteredAndSorted = [...characters].sort((a, b) => getScore(b) - getScore(a)).filter(c => {
                const matchesCategory = activeCategory === 'Todos' || (c.tags && c.tags.includes(activeCategory));
                const matchesSearch = (c.name || '').toLowerCase().includes(search.toLowerCase()) || (c.tags || []).some(t => t.toLowerCase().includes(search.toLowerCase()));
                return matchesCategory && matchesSearch;
            });

            if (loading) return (
                <div className="h-full flex flex-col items-center justify-center gap-3">
                    <div className="w-10 h-10 rounded-full border-2 border-white/20 border-t-white animate-spin"></div>
                    <span className="text-sm text-white/50 uppercase tracking-widest">Cargando datos...</span>
                </div>
            );

            if (error) return (
                <div className="h-full flex flex-col items-center justify-center p-8 text-center">
                    <i className="ri-database-2-line text-4xl text-white/40 mb-4"></i>
                    <h2 className="font-display text-2xl tracking-wide mb-2">Error de conexión</h2>
                    <p className="text-xs text-white/40 mb-6 max-w-xs">{error}</p>
                    <button onClick={() => window.location.reload()} className="bg-white text-black rounded-full px-6 py-2.5 text-sm font-bold uppercase hover:bg-gray-300 transition-colors">Reintentar</button>
                </div>
            );

            return (
                <div className="h-full overflow-y-auto">
                    <div className="max-w-6xl mx-auto px-3 sm:px-6 py-4 md:py-6">
                        <header className="mb-5">
                            <h1 className="font-display text-3xl md:text-4xl tracking-wide mb-1">Directorio</h1>
                            <p className="text-xs text-white/40">Recomendaciones optimizadas por algoritmo.</p>
                        </header>
                        <div className="relative mb-4">
                            <i className="ri-search-line absolute left-4 top-1/2 -translate-y-1/2 text-white/40"></i>
                            <input type="text" placeholder="Buscar personaje o etiqueta..." value={search} onChange={e => setSearch(e.target.value)} className="w-full bg-ventarys-card border border-white/10 rounded-full pl-11 pr-4 py-3 text-sm focus:outline-none focus:border-white/40 placeholder:text-white/30 transition-colors" />
                        </div>
                        <div className="flex gap-2 overflow-x-auto scrollbar-hide pb-1 mb-5">
                            {allCategories.map(cat => (
                                <button key={cat} onClick={() => setActiveCategory(cat)} className={`px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-colors ${activeCategory === cat ? 'bg-white text-black' : 'bg-ventarys-card text-white/60 hover:text-white hover:bg-white/10 border border-white/10'}`}>
                                    {cat}
                                </button>
                            ))}
                        </div>
                        <p className="text-[10px] font-bold tracking-[0.2em] uppercase text-white/30 mb-3">{filteredAndSorted.length} entidades</p>
                        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3">
                            {filteredAndSorted.map((char, idx) => {
                                const isRecommended = activeCategory === 'Todos' && !search && getScore(char) > 0 && idx < 3;
                                return <CharCard key={char.id} char={char} recommended={isRecommended} onSelect={onSelect} />;
                            })}
                            {filteredAndSorted.length === 0 && (
                                <div className="col-span-full text-center py-20 text-white/30 text-sm uppercase tracking-widest">[404] Entidad no encontrada.</div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const CreateCharView = () => {
            const [formData, setFormData] = useState({ name: '', avatar: '', description: '', personality: '', firstMessage: '', systemPrompt: '', tags: '' });
            
            const handleSubmit = e => {
                e.preventDefault();
                const newChar = {
                    id: 'char_' + Date.now(),
                    ...formData,
                    banner: formData.avatar,
                    tags: formData.tags.split(',').map(t => t.trim()).filter(t => t),
                    tokens: "0", msgCount: "0"
                };
                const issueTitle = encodeURIComponent(`Nuevo Personaje: ${newChar.name}`);
                const issueBody = encodeURIComponent(`Por favor añade este personaje al archivo \`chars.json\`:\n\n\`\`\`json\n${JSON.stringify(newChar, null, 2)}\n\`\`\``);
                window.open(`https://github.com/Juanoto2012/VentarysRP/issues/new?title=${issueTitle}&body=${issueBody}`, '_blank');
            };
            
            const handleChange = e => setFormData({ ...formData, [e.target.name]: e.target.value });

            return (
                <div className="h-full overflow-y-auto">
                    <div className="max-w-2xl mx-auto px-3 sm:px-6 py-4 md:py-6">
                        <header className="mb-6">
                            <h1 className="font-display text-3xl md:text-4xl tracking-wide mb-1">Forjar entidad</h1>
                            <p className="text-xs text-white/40">Construye JSON → exporta a GitHub.</p>
                        </header>
                        <form onSubmit={handleSubmit} className="space-y-4 bg-ventarys-panel border border-white/10 rounded-2xl p-4 md:p-6">
                            <Field label="Nombre completo"><input required type="text" name="name" value={formData.name} onChange={handleChange} className="input" /></Field>
                            <Field label="Tags (separados por comas)"><input required type="text" name="tags" placeholder="Ej: Sci-Fi, Femenino, Romance" value={formData.tags} onChange={handleChange} className="input" /></Field>
                            <Field label="Avatar (URL)"><input required type="url" name="avatar" value={formData.avatar} onChange={handleChange} className="input" /></Field>
                            <Field label="Descripción corta"><textarea required name="description" value={formData.description} onChange={handleChange} rows="2" className="input resize-none" /></Field>
                            <Field label="Personalidad"><textarea required name="personality" value={formData.personality} onChange={handleChange} rows="2" className="input resize-none" /></Field>
                            <Field label="Primer mensaje"><textarea required name="firstMessage" value={formData.firstMessage} onChange={handleChange} rows="3" className="input resize-none" /></Field>
                            <Field label="System prompt (instrucciones LLM)"><textarea required name="systemPrompt" value={formData.systemPrompt} onChange={handleChange} rows="4" className="input resize-none" /></Field>
                            <button type="submit" className="w-full bg-white text-black rounded-full px-6 py-3 text-sm font-bold uppercase hover:bg-gray-300 transition-colors flex justify-center items-center gap-2">
                                <i className="ri-github-fill text-lg"></i> Generar ticket en GitHub
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        const Field = ({ label, children }) => (
            <div className="space-y-1.5">
                <label className="block text-xs font-bold uppercase tracking-wider text-white/70">{"> "} {label}</label>
                {children}
            </div>
        );

        const ChatView = ({ character, messages, memory, onUpdateMemory, apiSettings, onSendMessage, onRewind, onBack }) => {
            const [input, setInput] = useState('');
            const [inputMode, setInputMode] = useState('normal'); // 'normal', 'say', 'do', 'story'
            const [isMemoryOpen, setIsMemoryOpen] = useState(false);
            const [localMemory, setLocalMemory] = useState(memory);
            const [isGeneratingSummary, setIsGeneratingSummary] = useState(false);
            const messagesEndRef = useRef(null);
            
            useEffect(() => messagesEndRef.current?.scrollIntoView({ behavior: "smooth" }), [messages]);
            useEffect(() => setLocalMemory(memory), [memory]);

            const handleSend = (e) => {
                if (e) e.preventDefault();
                if (!input.trim()) return;
                
                let formattedInput = input;
                if (inputMode === 'say') formattedInput = `[Dice]: "${input}"`;
                else if (inputMode === 'do') formattedInput = `[Acción]: *${input}*`;
                else if (inputMode === 'story') formattedInput = `[Narrativa]: ${input}`;
                
                onSendMessage(formattedInput, false, input);
                setInput('');
            };

            const handleGoOn = () => {
                onSendMessage("(Continúa la respuesta anterior desde donde te quedaste, sin repetir lo que ya dijiste)", true, "(Continúa...)");
            };

            const handleAutoSummarize = async () => {
                if(messages.length < 2) return alert("Se requiere más conversación para resumir.");
                setIsGeneratingSummary(true);
                try {
                    const history = messages.slice(-25).filter(m => !m.isHidden);
                    const payload = [
                        { role: 'system', content: 'Eres un asistente analizador de roleplay. Escribe un resumen compacto (máx 200 palabras) de la historia hasta ahora usando viñetas. Incluye detalles clave, el estado de la relación y los últimos eventos ocurridos. Sé directo y objetivo.' },
                        ...history.map(m => ({ role: m.sender === 'user' ? 'user' : 'assistant', content: m.text }))
                    ];
                    
                    const response = await fetch(apiSettings.endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', ...(apiSettings.apiKey && {'Authorization': `Bearer ${apiSettings.apiKey}`}) },
                        body: JSON.stringify({ model: apiSettings.model || 'default', messages: payload, temperature: 0.3 })
                    });
                    
                    if (!response.ok) throw new Error("API Falló");
                    const data = await response.json();
                    setLocalMemory(data.choices[0].message.content);
                } catch (error) {
                    alert("Error al generar resumen: " + error.message);
                }
                setIsGeneratingSummary(false);
            };

            let userRoundsCount = 0;

            return (
                <div className="h-full flex flex-col relative">
                    <div className="flex items-center gap-3 px-3 sm:px-6 py-2.5 border-b border-white/10 bg-black/40 backdrop-blur shrink-0">
                        {/* Enhanced Mobile Back Button */}
                        <button onClick={onBack} className="md:hidden w-auto px-2 h-9 -ml-2 rounded-lg flex items-center justify-center text-white/70 hover:text-white hover:bg-white/5 gap-1">
                            <i className="ri-arrow-left-s-line text-2xl"></i>
                            <span className="text-xs font-bold uppercase tracking-wider">Salir</span>
                        </button>
                        
                        <img src={character.avatar} className="hidden md:block w-9 h-9 rounded-full object-cover border border-white/20" alt={character.name} />
                        <div className="flex-1 min-w-0">
                            <h2 className="font-bold text-sm truncate">{character.name}</h2>
                            <p className="text-[11px] text-white/40 truncate">{character.personality}</p>
                        </div>
                        <div className="flex items-center gap-1">
                            <button onClick={() => setIsMemoryOpen(true)} title="Memoria de Chat" className={`w-9 h-9 rounded-lg flex items-center justify-center transition-colors ${memory ? 'text-white bg-white/10' : 'text-white/60 hover:text-white hover:bg-white/5'}`}>
                                <i className="ri-brain-line text-lg"></i>
                            </button>
                            <button onClick={onRewind} title="Rebobinar / borrar último" className="w-9 h-9 rounded-lg flex items-center justify-center text-white/60 hover:text-white hover:bg-white/5">
                                <i className="ri-arrow-go-back-line text-lg"></i>
                            </button>
                        </div>
                    </div>

                    <div className="flex-1 overflow-y-auto">
                        <div className="max-w-2xl mx-auto px-3 sm:px-6 py-6 space-y-5">
                            <div className="text-center pb-4">
                                <img src={character.avatar} className="w-16 h-16 rounded-2xl object-cover mx-auto mb-3 border border-white/20" alt={character.name} />
                                <h1 className="font-bold text-lg mb-1">{character.name}</h1>
                                <p className="text-sm text-white/40 mb-3">{character.description}</p>
                                <div className="inline-block text-[10px] font-bold tracking-[0.2em] uppercase text-white/40 border border-white/20 rounded-full px-3 py-1">Secuencia iniciada</div>
                            </div>
                            
                            {messages.map((msg, index) => {
                                if (msg.sender === 'user' && !msg.isHidden) userRoundsCount++;
                                const isAIResponse = msg.sender === 'ai' && !msg.isTyping;
                                const isEndOfRound = index === messages.length - 1 || messages[index + 1].sender === 'user';
                                const showAd = isAIResponse && userRoundsCount > 0 && userRoundsCount % 10 === 0 && isEndOfRound;
                                
                                if (msg.isHidden) {
                                    return (
                                        <div key={msg.id} className="text-center text-[10px] font-bold text-white/30 uppercase tracking-widest my-2">
                                            [ Secuencia continuada por el usuario ]
                                        </div>
                                    );
                                }

                                return (
                                    <React.Fragment key={msg.id}>
                                        {msg.sender === 'system' ? (
                                            <div className="text-center text-[11px] text-red-400/80 border border-red-500/20 rounded-lg py-2 px-3 bg-red-500/5 msg-enter">{msg.text}</div>
                                        ) : msg.sender === 'user' ? (
                                            <div className="flex justify-end msg-enter">
                                                <div className="max-w-[80%] bg-white text-black text-sm leading-relaxed rounded-2xl rounded-tr-sm px-4 py-2.5 whitespace-pre-wrap">{msg.text}</div>
                                            </div>
                                        ) : (
                                            <div className="flex gap-2.5 msg-enter">
                                                <img src={character.avatar} className="w-8 h-8 rounded-full object-cover border border-white/15 mt-0.5" alt="" />
                                                <div className="max-w-[80%]">
                                                    <div className="bg-ventarys-card border border-white/10 text-sm leading-relaxed rounded-2xl rounded-tl-sm px-4 py-2.5 whitespace-pre-wrap">
                                                        {msg.isTyping ? <TypingIndicator /> : msg.text}
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                        {showAd && <AdInjector />}
                                    </React.Fragment>
                                );
                            })}
                            <div ref={messagesEndRef} />
                        </div>
                    </div>

                    <div className="border-t border-white/10 bg-black/40 backdrop-blur px-3 sm:px-6 py-3 shrink-0 flex flex-col">
                        <div className="max-w-2xl mx-auto w-full">
                            {/* Dungeon / AI Modes & Go On */}
                            <div className="flex items-center justify-between mb-2 px-1">
                                <div className="flex gap-1.5 overflow-x-auto scrollbar-hide">
                                    {[
                                        { id: 'normal', label: '💬 Normal' },
                                        { id: 'say', label: '🗣️ Decir' },
                                        { id: 'do', label: '🏃 Hacer' },
                                        { id: 'story', label: '📖 Historia' }
                                    ].map(mode => (
                                        <button 
                                            key={mode.id}
                                            onClick={() => setInputMode(mode.id)}
                                            className={`text-[10px] whitespace-nowrap uppercase font-bold px-2.5 py-1 rounded-full transition-colors ${inputMode === mode.id ? 'bg-white text-black' : 'bg-ventarys-card text-white/50 border border-white/10 hover:text-white'}`}
                                        >
                                            {mode.label}
                                        </button>
                                    ))}
                                </div>
                                <button type="button" onClick={handleGoOn} className="shrink-0 ml-2 text-[10px] font-bold uppercase flex items-center gap-1 text-white hover:text-black bg-white/10 hover:bg-white px-3 py-1 rounded-full border border-white/10 transition-all shadow-md">
                                    Go On <i className="ri-skip-forward-mini-fill"></i>
                                </button>
                            </div>

                            <form onSubmit={handleSend} className="flex items-center gap-2">
                                <div className="flex-1 bg-ventarys-card border border-white/15 rounded-xl focus-within:border-white/40 transition-colors">
                                    <textarea 
                                        value={input} 
                                        onChange={e => setInput(e.target.value)} 
                                        onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) handleSend(e); }} 
                                        placeholder={inputMode === 'normal' ? "Escribe un mensaje..." : `Modo activo: ${inputMode.toUpperCase()}`}
                                        className="w-full bg-transparent text-sm px-4 py-3 max-h-28 resize-none focus:outline-none placeholder:text-white/30" 
                                        rows="1" 
                                    />
                                </div>
                                <button type="submit" disabled={!input.trim()} className="w-12 h-12 shrink-0 rounded-xl bg-white text-black flex items-center justify-center hover:bg-gray-300 disabled:opacity-30 transition-colors">
                                    <i className="ri-arrow-up-line text-xl"></i>
                                </button>
                            </form>
                        </div>
                    </div>

                    {/* Chat Memory Modal */}
                    {isMemoryOpen && (
                        <div className="absolute inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                            <div className="bg-ventarys-panel border border-white/10 rounded-2xl w-full max-w-lg p-5 flex flex-col shadow-2xl">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="font-bold text-lg flex items-center gap-2"><i className="ri-brain-line"></i> Memoria del Chat</h3>
                                    <button onClick={() => setIsMemoryOpen(false)} className="text-white/50 hover:text-white"><i className="ri-close-line text-xl"></i></button>
                                </div>
                                <p className="text-xs text-white/50 mb-4 leading-relaxed">
                                    Sistema tipo Janitor AI. Define un resumen para que la IA nunca pierda el contexto actual. 
                                    Se inyectará permanentemente en el Prompt del Sistema.
                                </p>
                                <textarea 
                                    value={localMemory}
                                    onChange={(e) => setLocalMemory(e.target.value)}
                                    className="w-full bg-ventarys-card border border-white/10 rounded-xl p-3 text-sm h-48 mb-5 focus:outline-none focus:border-white/40 resize-none text-white/80"
                                    placeholder="- Entorno actual: Bosque oscuro&#10;- Dinámica: {{char}} desconfía del usuario pero lo protege.&#10;- Eventos recientes: Fueron atacados por bandidos y escaparon."
                                />
                                <div className="flex justify-between items-center">
                                    <button onClick={handleAutoSummarize} disabled={isGeneratingSummary || messages.length < 2} className="text-xs font-bold uppercase tracking-wider bg-ventarys-card hover:bg-white/10 px-4 py-2.5 rounded-lg border border-white/10 transition-colors flex items-center gap-2 disabled:opacity-50">
                                        {isGeneratingSummary ? <i className="ri-loader-4-line animate-spin"></i> : <i className="ri-magic-line"></i>}
                                        {isGeneratingSummary ? 'Generando...' : 'Auto-Resumen'}
                                    </button>
                                    <button onClick={() => { onUpdateMemory(localMemory); setIsMemoryOpen(false); }} className="text-xs font-bold uppercase tracking-wider bg-white text-black px-6 py-2.5 rounded-lg hover:bg-gray-200 transition-colors">
                                        Guardar
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const SettingsView = ({ settings, onSave, puterSignedIn, onLogin, onLogout, onSyncPush, onSyncPull }) => {
            const [localSettings, setLocalSettings] = useState(settings);
            const [saved, setSaved] = useState(false);
            
            const handleSubmit = e => {
                e.preventDefault();
                onSave(localSettings);
                setSaved(true);
                setTimeout(() => setSaved(false), 3000);
            };

            return (
                <div className="h-full overflow-y-auto">
                    <div className="max-w-2xl mx-auto px-3 sm:px-6 py-4 md:py-6 space-y-5">
                        <header>
                            <h1 className="font-display text-3xl md:text-4xl tracking-wide mb-1">Configuración</h1>
                            <p className="text-xs text-white/40">Parámetros del sistema y sincronización.</p>
                        </header>
                        
                        <div className="bg-ventarys-panel border border-white/10 rounded-2xl p-4 md:p-6">
                            <div className="flex items-center gap-3 mb-5">
                                <div className="w-11 h-11 rounded-xl bg-white text-black flex items-center justify-center shrink-0">
                                    <i className="ri-cloud-line text-xl"></i>
                                </div>
                                <div>
                                    <h2 className="font-bold text-base">Sinc. Cloud</h2>
                                    <p className="text-xs text-white/40">Respaldo remoto vía Puter.js</p>
                                </div>
                            </div>
                            
                            {!puterSignedIn ? (
                                <div className="text-center py-4">
                                    <p className="text-white/40 text-sm mb-4">Inicia sesión para respaldar chats y ajustes en la nube. (Los datos locales se guardan automáticamente).</p>
                                    <button onClick={onLogin} className="bg-white text-black rounded-full px-6 py-2.5 text-sm font-bold uppercase hover:bg-gray-300 transition-colors">
                                        <i className="ri-login-box-line mr-1.5 align-middle"></i> Conectar Puter
                                    </button>
                                </div>
                            ) : (
                                <div className="flex flex-col gap-3">
                                    <p className="text-white font-bold uppercase text-xs blink text-center mb-1">[ Estado: Conectado ]</p>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                        <button onClick={onSyncPush} className="bg-white text-black rounded-full px-4 py-2.5 text-sm font-bold uppercase hover:bg-gray-300 transition-colors">
                                            <i className="ri-upload-cloud-2-line mr-1.5 align-middle"></i> Subir nube
                                        </button>
                                        <button onClick={onSyncPull} className="bg-white text-black rounded-full px-4 py-2.5 text-sm font-bold uppercase hover:bg-gray-300 transition-colors">
                                            <i className="ri-download-cloud-2-line mr-1.5 align-middle"></i> Bajar nube
                                        </button>
                                    </div>
                                    <div className="text-center mt-1">
                                        <button onClick={onLogout} className="text-white/50 uppercase text-xs font-bold hover:underline">Desconectar Puter</button>
                                    </div>
                                </div>
                            )}
                        </div>
                        
                        <div className="bg-ventarys-panel border border-white/10 rounded-2xl p-4 md:p-6">
                            <div className="flex items-center gap-3 mb-5">
                                <div className="w-11 h-11 rounded-xl bg-white text-black flex items-center justify-center shrink-0">
                                    <i className="ri-terminal-box-line text-xl"></i>
                                </div>
                                <div>
                                    <h2 className="font-bold text-base">SYS.Config</h2>
                                    <p className="text-xs text-white/40">Conexión LLM (Temperatura actual bloqueada: 0.3)</p>
                                </div>
                            </div>
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <Field label="Endpoint URL"><input type="text" value={localSettings.endpoint} onChange={e => setLocalSettings({ ...localSettings, endpoint: e.target.value })} className="input" /></Field>
                                <Field label="API Key">
                                    <div className="relative">
                                        <input type="password" value={localSettings.apiKey} onChange={e => setLocalSettings({ ...localSettings, apiKey: e.target.value })} className="input pr-10" placeholder="***" />
                                        <i className="ri-key-2-line absolute right-3 top-3 text-white/40"></i>
                                    </div>
                                </Field>
                                <Field label="Modelo activo">
                                    <div className="relative">
                                        <select value={localSettings.model} onChange={e => setLocalSettings({ ...localSettings, model: e.target.value })} className="input appearance-none">
                                            <option value="default">DEFAULT (api.llm7.io)</option>
                                            <option value="fast">FAST (api.llm7.io)</option>
                                        </select>
                                        <i className="ri-arrow-down-s-line absolute right-3 top-3 text-white/40 pointer-events-none"></i>
                                    </div>
                                </Field>
                                <Field label="Persona de usuario [inyectada en SYS_PROMPT]">
                                    <textarea value={localSettings.userPersona} onChange={e => setLocalSettings({ ...localSettings, userPersona: e.target.value })} className="input resize-none" rows="4" />
                                </Field>
                                <div className="pt-3 flex items-center justify-between border-t border-white/10">
                                    <button type="submit" className="bg-white text-black rounded-full px-6 py-2.5 text-sm font-bold uppercase hover:bg-gray-300 transition-colors">Sobrescribir</button>
                                    {saved && <span className="text-white text-xs font-bold blink">[GUARDADO_OK]</span>}
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    }

    // Await React to be globally available before execution
    (function start() {
        if (window.React && window.ReactDOM && window.Babel) return bootApp();
        setTimeout(start, 100);
    })();
    </script>
</body>
</html>
