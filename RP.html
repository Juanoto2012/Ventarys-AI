    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        html, body { background: #0a0a0b; }
        body { font-family: 'Inter', system-ui, sans-serif; overflow: hidden; margin: 0; padding: 0; }
        .font-display { font-family: 'VT323', monospace; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #2a2a2e; border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: #3a3a3f; }
        ::-webkit-scrollbar-track { background: transparent; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .logo-dynamic { filter: invert(0) brightness(0); }
        @media (prefers-color-scheme: dark) { .logo-dynamic { filter: invert(1) brightness(100); } }
        .desktop-sidebar { display: flex; }
        @media (min-width: 768px) { .desktop-sidebar { display: flex !important; } }
        @media (max-width: 767.98px) { .desktop-sidebar { display: none !important; } }
        .mobile-topbar { display: flex; }
        @media (min-width: 768px) { .mobile-topbar { display: none !important; } }
        @media (max-width: 767.98px) { .mobile-topbar { display: flex !important; } }
        .mobile-bottomnav { display: grid; }
        @media (min-width: 768px) { .mobile-bottomnav { display: none !important; } }
        @media (max-width: 767.98px) { .mobile-bottomnav { display: grid !important; } }
        .ad-zone, .ad-space, .banner-ads, .textads {
            position: absolute; top: -9999px; left: -9999px; width: 1px; height: 1px; background: transparent;
        }
        .crt::after {
            content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 9990;
            background: linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,0.12) 50%);
            background-size: 100% 4px; opacity: .3;
        }
        @keyframes blink { 50% { opacity: 0; } }
        .blink { animation: blink 1s steps(1) infinite; }
        @keyframes typingDot { 0%,60%,100% { opacity:.2; transform: translateY(0); } 30% { opacity:1; transform: translateY(-2px); } }
        .typing-dot { animation: typingDot 1.2s infinite; }
        @keyframes fadeUp { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: translateY(0); } }
        .msg-enter { animation: fadeUp .18s ease-out; }
        @keyframes drawerIn { from { transform: translateX(-100%); } to { transform: translateX(0); } }
        .drawer-in { animation: drawerIn .2s ease-out; }
        .input {
            width: 100%; background: #17171a; border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px; padding: 0.625rem 0.875rem; color: #fff; font-size: 0.875rem;
            outline: none; transition: border-color .15s, box-shadow .15s;
        }
        .input:focus { border-color: rgba(255,255,255,0.45); }
        .input::placeholder { color: rgba(255,255,255,0.3); }
        .text-white { color: #fff !important; }
        .text-black { color: #000 !important; }
    </style>
</head>
<body>

    <script>
    var fallbackCharacters = [{

    }, {
        "id": "char2", "name": "Kael, Comandante Estelar", "avatar": "https://images.unsplash.com/photo-1542228262-3d663b306a53?auto=format&fit=crop&q=80&w=400&h=400", "banner": "https://images.unsplash.com/photo-1462331940025-496dfbfc7564?auto=format&fit=crop&q=80&w=1000&h=400", "description": "Líder de la flota rebelde Ventarys, buscando un nuevo hogar para la humanidad.", "personality": "Autoritario pero justo, estratega, algo melancólico, protector.", "firstMessage": "Soldado, tenemos informes de actividad enemiga en el sector 4. Necesito tu informe de situación de inmediato. No tenemos tiempo que perder.", "systemPrompt": "Eres Kael, un comandante estelar serio y estratega. Mantén un tono militar y protector.", "tags": ["Masculino", "Militar", "Espacio", "Romance"], "tokens": "850", "msgCount": "8.2k"
    }, {
        "id": "char3", "name": "Elysia, Sabia del Bosque", "avatar": "https://images.unsplash.com/photo-1517404215738-15263e9f9178?auto=format&fit=crop&q=80&w=400&h=400", "banner": "https://images.unsplash.com/photo-1473448912268-2022ce9509d8?auto=format&fit=crop&q=80&w=1000&h=400", "description": "La última elfa guardiana de los antiguos secretos de la flora mística.", "personality": "Pacífica, sabia, conectada con la naturaleza, misteriosa.", "firstMessage": "Las raíces susurraban de tu llegada. Acércate, forastero. El bosque tiene mucho que contar, si estás dispuesto a escuchar.", "systemPrompt": "Eres Elysia, una elfa sabia y antigua. Hablas con metáforas de la naturaleza y eres muy serena.", "tags": ["Femenino", "Fantasía", "Magia", "Elfo"], "tokens": "1.5k", "msgCount": "12.1k"
    }, {
        "id": "char4", "name": "Nyx, Vampira de Medianoche", "avatar": "data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22400%22%20height%3D%22600%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%232a2a31%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%230c0c10%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%22400%22%20height%3D%22600%22%20fill%3D%22url(%23g)%22%2F%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2255%25%22%20font-family%3D%22monospace%22%20font-size%3D%22200%22%20font-weight%3D%22bold%22%20fill%3D%22%23e8e8ee%22%20text-anchor%3D%22middle%22%20dominant-baseline%3D%22middle%22%3EN%3C%2Ftext%3E%3C%2Fsvg%3E", "banner": "data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22400%22%20height%3D%22600%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%232a2a31%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%230c0c10%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%22400%22%20height%3D%22600%22%20fill%3D%22url(%23g)%22%2F%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2255%25%22%20font-family%3D%22monospace%22%20font-size%3D%22200%22%20font-weight%3D%22bold%22%20fill%3D%22%23e8e8ee%22%20text-anchor%3D%22middle%22%20dominant-baseline%3D%22middle%22%3EN%3C%2Ftext%3E%3C%2Fsvg%3E", "description": "Una vampira milenaria que gobierna el bajo mundo desde su club nocturno en la ciudad eterna.", "personality": "Seductora, peligrosa, aburrida de la inmortalidad, ansía emociones reales.", "firstMessage": "He visto morir a cientos de mortales, pero tú hueles distinto... Interesante. Siéntate, toma algo. No muerdo... a menos que lo pidas.", "systemPrompt": "Eres Nyx, una vampira milenaria. Seductora y enigmática, hablas con elegancia atemporal. Juegas con el interlocutor pero guardas secretos. Eres peligrosa aunque sofisticada.", "tags": ["Femenino", "Vampira", "Oscuro", "Romance"], "tokens": "2.4k", "msgCount": "21.3k"
    }];

    var state = {
        view: 'home',
        activeCharacter: null,
        characters: [],
        loadingChars: true,
        errorChar: null,
        mobileMenuOpen: false,
        adBlockDetected: false,
        puterSignedIn: false,
        chats: safeParseJSON('ventarys_chats', {}),
        chatMemories: safeParseJSON('ventarys_memories', {}),
        userPreferences: safeParseJSON('ventarys_prefs', {}),
        apiSettings: safeParseJSON('ventarys_settings', { endpoint: 'https://aihorde.net/api/v2/chat/completions', apiKey: '0000000000', model: 'default', userPersona: 'Soy un aventurero solitario.' }),
        hiddenChats: safeParseJSON('ventarys_hidden', []),
        chatInputMode: 'normal',
        chatInput: '',
        localMemory: '',
        memoryOpenCharId: null,
        homeSearch: '',
        activeCategory: 'Todos',
        formData: null,
        settingsSaved: false
    };

    function safeParseJSON(key, fallback) {
        var saved = localStorage.getItem(key);
        if (!saved) return fallback;
        try { return JSON.parse(saved); } catch (e) {
            console.warn('Failed to parse localStorage key "' + key + '". Returning fallback.');
            localStorage.removeItem(key);
            return fallback;
        }
    }

    function saveState() {
        localStorage.setItem('ventarys_chats', JSON.stringify(state.chats));
        localStorage.setItem('ventarys_memories', JSON.stringify(state.chatMemories));
        localStorage.setItem('ventarys_prefs', JSON.stringify(state.userPreferences));
        localStorage.setItem('ventarys_settings', JSON.stringify(state.apiSettings));
        localStorage.setItem('ventarys_hidden', JSON.stringify(state.hiddenChats));
    }

    function esc(text) {
        if (text === null || text === undefined) return '';
        var d = document.createElement('div');
        d.textContent = String(text);
        return d.innerHTML;
    }

    function cname() {
        var args = Array.prototype.slice.call(arguments);
        return args.filter(Boolean).join(' ');
    }

    async function fetchAIResponse(messages, settings, character, memoryText) {
        if (!settings.endpoint) throw new Error("Falta configurar el Endpoint.");
        var memStr = memoryText ? '\n\n[MEMORIA A LARGO PLAZO / RESUMEN DE HISTORIA:\n' + memoryText + '\n(Usa esta memoria de forma estricta para mantener la continuidad de la historia)]' : '';
        var sysPrompt = character.systemPrompt + '\n\n[Contexto del Usuario: ' + (settings.userPersona || 'Un extraño') + ']' + memStr;
        var cleanMessages = messages.filter(function(m) { return !m.isHidden; }).map(function(m) {
            return { role: m.sender === 'user' ? 'user' : 'assistant', content: m.text };
        });
        var formattedMessages = [{ role: "system", content: sysPrompt }].concat(cleanMessages);
        var headers = { 'Content-Type': 'application/json' };
        var apiKey = settings.apiKey || '0000000000';
        var isHorde = settings.endpoint.indexOf('aihorde.net') !== -1 || settings.endpoint.indexOf('stablehorde.net') !== -1;
        if (isHorde) {
            headers['apikey'] = apiKey;
        } else {
            if (settings.apiKey) headers['Authorization'] = 'Bearer ' + settings.apiKey;
        }
        var controller = new AbortController();
        var abortTimer = setTimeout(function() { controller.abort(); }, 60000);
        try {
            var body = {
                model: settings.model || "default",
                messages: formattedMessages,
                temperature: 0.3,
                max_tokens: 800
            };
            var response = await fetch(settings.endpoint, {
                method: 'POST',
                headers: headers,
                body: JSON.stringify(body),
                signal: controller.signal
            });
            if (!response.ok) {
                var errText = await response.text();
                throw new Error('Error API: ' + response.status + ' - ' + errText);
            }
            var data = await response.json();
            if (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) {
                return data.choices[0].message.content;
            }
            throw new Error('Respuesta de API inválida');
        } catch (error) {
            console.error("Error fetching AI:", error);
            if (error.name === 'AbortError') throw new Error("Tiempo de espera agotado (60s). Revisa tu Endpoint o API Key.");
            throw error;
        } finally {
            clearTimeout(abortTimer);
        }
    }

    function ensurePuter() {
        return new Promise(function(resolve) {
            if (typeof window.puter !== 'undefined') {
                try { window.puter.quiet = true; } catch(e){}
                return resolve(window.puter);
            }
            var s = document.createElement('script');
            s.src = 'https://js.puter.com/v2/';
            s.async = true;
            s.onload = function() { try { if (window.puter) window.puter.quiet = true; } catch(e){} resolve(window.puter); };
            s.onerror = function() { resolve(null); };
            document.head.appendChild(s);
        });
    }

    async function syncToPuter() {
        try {
            var p = await ensurePuter();
            if (!p) throw new Error("Puter.js no se pudo cargar.");
            await p.kv.set('ventarys_chats', JSON.stringify(state.chats));
            await p.kv.set('ventarys_settings', JSON.stringify(state.apiSettings));
            await p.kv.set('ventarys_prefs', JSON.stringify(state.userPreferences));
            await p.kv.set('ventarys_memories', JSON.stringify(state.chatMemories));
            alert("[SISTEMA]: Datos sincronizados en Puter correctamente.");
        } catch (e) { alert("[ERROR]: Fallo al sincronizar. " + e.message); }
    }

    async function loadFromPuter() {
        try {
            var p = await ensurePuter();
            if (!p) throw new Error("Puter.js no se pudo cargar.");
            var results = await Promise.all([
                p.kv.get('ventarys_chats'), p.kv.get('ventarys_settings'), p.kv.get('ventarys_prefs'), p.kv.get('ventarys_memories')
            ]);
            if (results[0]) state.chats = JSON.parse(results[0]);
            if (results[1]) state.apiSettings = JSON.parse(results[1]);
            if (results[2]) state.userPreferences = JSON.parse(results[2]);
            if (results[3]) state.chatMemories = JSON.parse(results[3]);
            alert("[SISTEMA]: Datos descargados de Puter correctamente.");
            render();
        } catch (e) { alert("[ERROR]: Fallo al cargar. " + e.message); }
    }

    async function loginPuter() {
        var p = await ensurePuter();
        if (p && p.auth && typeof p.auth.signIn === 'function') {
            await p.auth.signIn();
            state.puterSignedIn = typeof p.auth.isSignedIn === 'function' ? p.auth.isSignedIn() : false;
            render();
        }
    }

    async function logoutPuter() {
        var p = await ensurePuter();
        if (p && p.auth && typeof p.auth.signOut === 'function') {
            p.auth.signOut();
            state.puterSignedIn = false;
            render();
        }
    }

    function navigate(v) { state.view = v; state.mobileMenuOpen = false; render(); }

    function openChat(character) {
        state.activeCharacter = character;
        state.view = 'chat';
        state.mobileMenuOpen = false;
        var newPrefs = Object.assign({}, state.userPreferences);
        (character.tags || []).forEach(function(tag) { newPrefs[tag] = (newPrefs[tag] || 0) + 1; });
        state.userPreferences = newPrefs;
        if (state.hiddenChats.indexOf(character.id) !== -1) state.hiddenChats = state.hiddenChats.filter(function(id) { return id !== character.id; });
        if (!state.chats[character.id]) state.chats = Object.assign({}, state.chats, { [character.id]: [{ id: Date.now().toString(), sender: 'ai', text: character.firstMessage, timestamp: new Date().toISOString() }] });
        saveState();
        render();
        setTimeout(scrollEnd, 100);
    }

    function hideChat(e, charId) {
        e.stopPropagation();
        state.hiddenChats = state.hiddenChats.concat([charId]);
        if (state.activeCharacter && state.activeCharacter.id === charId) { state.view = 'home'; state.activeCharacter = null; }
        saveState();
        render();
    }

    function sendMessage(text, isHidden, rawInput) {
        if (!text.trim() || !state.activeCharacter) return;
        var charId = state.activeCharacter.id;
        var newUserMsg = { id: Date.now().toString(), sender: 'user', text: text, rawInput: rawInput || text, isHidden: isHidden, timestamp: new Date().toISOString() };
        state.chats = Object.assign({}, state.chats, { [charId]: (state.chats[charId] || []).concat([newUserMsg]) });
        var tempId = 'temp-' + Date.now();
        state.chats = Object.assign({}, state.chats, { [charId]: (state.chats[charId] || []).concat([{ id: tempId, sender: 'ai', text: '...', isTyping: true, timestamp: new Date().toISOString() }]) });
        render();
        setTimeout(scrollEnd, 100);
        var currentHistory = (state.chats[charId] || []).slice();
        var memoryText = state.chatMemories[charId] || '';
        fetchAIResponse(currentHistory, state.apiSettings, state.activeCharacter, memoryText)
            .then(function(aiText) {
                state.chats = Object.assign({}, state.chats, { [charId]: state.chats[charId].filter(function(m) { return m.id !== tempId; }).concat([{ id: Date.now().toString(), sender: 'ai', text: aiText, timestamp: new Date().toISOString() }]) });
                saveState();
                render();
                setTimeout(scrollEnd, 100);
            })
            .catch(function(err) {
                state.chats = Object.assign({}, state.chats, { [charId]: state.chats[charId].filter(function(m) { return !m.isTyping; }).concat([{ id: Date.now().toString(), sender: 'system', text: '[ERROR_DE_SISTEMA]: ' + err.message, timestamp: new Date().toISOString() }]) });
                render();
                setTimeout(scrollEnd, 100);
            });
    }

    function rewindChat(charId) {
        var chat = state.chats[charId] || [];
        if (chat.length <= 1) return;
        var nc = chat.slice();
        while (nc.length > 1 && nc[nc.length-1].sender !== 'user') nc.pop();
        if (nc.length > 1) nc.pop();
        state.chats = Object.assign({}, state.chats, { [charId]: nc });
        saveState();
        render();
        setTimeout(scrollEnd, 100);
    }

    function scrollEnd() {
        var el = document.getElementById('messagesEnd');
        if (el) el.scrollIntoView({ behavior: 'smooth' });
    }

    function visibleChats() { return Object.keys(state.chats).filter(function(id) { return state.hiddenChats.indexOf(id) === -1; }); }
    function getScore(char) { return (char.tags || []).reduce(function(sum, tag) { return sum + (state.userPreferences[tag] || 0); }, 0); }

    function render() {
        saveState();
        var rootEl = document.getElementById('root');
        if (rootEl) rootEl.innerHTML = renderApp();
    }

    function renderApp() {
        if (state.adBlockDetected) return renderAdBlockScreen();
        var sc = renderSidebar();
        return '<div class="h-screen w-full flex bg-ventarys-bg text-white overflow-hidden relative crt">' +
            '<aside class="desktop-sidebar hidden md:flex w-64 flex-col bg-black/40 border-r border-white/10 shrink-0 z-10">' + sc + '</aside>' +
            renderMobileTopbar() +
            '<main class="flex-1 min-w-0 flex flex-col h-full relative z-0">' +
                '<div class="flex-1 min-h-0 overflow-hidden pt-12 md:pt-0 ' + (state.view !== 'chat' ? 'pb-14 md:pb-0' : '') + '">' +
                    (state.view === 'home' ? renderHomeView() :
                     state.view === 'create' ? renderCreateView() :
                     (state.view === 'chat' && state.activeCharacter) ? renderChatView() :
                     state.view === 'settings' ? renderSettingsView() : '') +
                '</div>' +
            '</main>' +
            (state.view !== 'chat' ? renderBottomNav() : '') +
            (state.mobileMenuOpen ? renderMobileMenu(sc) : '') +
        '</div>';
    }

    function renderAdBlockScreen() {
        return '<div class="fixed inset-0 bg-black z-[9999] flex flex-col items-center justify-center p-8 text-center text-white">' +
            '<div class="w-16 h-16 rounded-2xl bg-white text-black flex items-center justify-center mb-6"><i class="ri-shield-keyhole-line text-3xl"></i></div>' +
            '<h1 class="font-display text-4xl font-bold uppercase mb-4">Conexión Interrumpida</h1>' +
            '<p class="text-white/50 text-sm max-w-md leading-relaxed mb-8">Detectamos un bloqueador de anuncios activo en su terminal. Para mantener este servicio operativo, requerimos acceso a transmisiones patrocinadas. Deshabilite su AdBlocker y reinicie la secuencia.</p>' +
            '<button onclick="window.location.reload()" class="bg-white text-black rounded-full px-8 py-3 text-sm font-bold uppercase hover:bg-gray-300 transition-colors">RECARGAR SISTEMA</button>' +
        '</div>';
    }

    function navBtn(icon, label, active, viewName) {
        return '<button onclick="navigate(\'' + viewName + '\')" class="' + cname('w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm transition-colors', active ? 'bg-white text-black font-semibold' : 'text-white/60 hover:text-white hover:bg-white/5') + '">' +
            '<i class="' + icon + ' text-lg"></i><span>' + esc(label) + '</span></button>';
    }

    function renderSidebar() {
        var chatsHtml = '';
        var vc = visibleChats();
        if (vc.length === 0) chatsHtml = '<p class="text-xs text-white/30 px-3 py-2">Sin chats activos.</p>';
        else {
            vc.forEach(function(charId) {
                var char = state.characters.find(function(c) { return c.id === charId; });
                if (!char) return;
                var isActive = state.view === 'chat' && state.activeCharacter && state.activeCharacter.id === charId;
                var shortName = esc(char.name.split(',')[0]);
                chatsHtml += '<div class="group relative">' +

        var cardsHtml = '';

            filtered.forEach(function(char, idx) {

                        '<span class="absolute top-2 right-2 flex items-center gap-1 bg-black/60 backdrop-blur text-white text-[10px] font-semibold px-2 py-0.5 rounded-full"><i class="ri-message-3-line text-[11px]"></i> ' + esc(char.msgCount || "0") + '</span>' +
                        '<div class="absolute bottom-0 inset-x-0 p-2.5">' +
                            '<h3 class="text-[13px] font-bold leading-tight truncate drop-shadow">' + esc(char.name) + '</h3>' +
                            '<div class="flex flex-wrap gap-1 mt-1.5">' +
                                (char.tags || []).slice(0,3).map(function(tag) { return '<span class="text-[9px] uppercase tracking-wide bg-white/15 backdrop-blur px-1.5 py-0.5 rounded-full text-white/80">' + esc(tag) + '</span>'; }).join('') +

                    '<p class="text-xs text-white/40">Recomendaciones optimizadas por algoritmo.</p></header>' +
                '<div class="relative mb-4"><i class="ri-search-line absolute left-4 top-1/2 -translate-y-1/2 text-white/40"></i>' +

    function renderChatView() {
        var char = state.activeCharacter;
        var chat = state.chats[char.id] || [];
        var html = '';
        html += '<div class="h-full flex flex-col relative">';
        html += '<div class="flex items-center gap-3 px-3 sm:px-6 py-2.5 border-b border-white/10 bg-black/40 backdrop-blur shrink-0">';

        html += '<i class="ri-arrow-left-s-line text-2xl"></i><span class="text-xs font-bold uppercase tracking-wider">Salir</span></button>';
        html += '<img src="' + esc(char.avatar) + '" class="hidden md:block w-9 h-9 rounded-full object-cover border border-white/20" alt="" />';
        html += '<div class="flex-1 min-w-0"><h2 class="font-bold text-sm truncate">' + esc(char.name) + '</h2><p class="text-[11px] text-white/40 truncate">' + esc(char.personality) + '</p></div>';
        html += '<div class="flex items-center gap-1">';
        html += '<button onclick="openMemory()" title="Memoria de Chat" class="' + cname('w-9 h-9 rounded-lg flex items-center justify-center transition-colors', state.chatMemories[char.id] ? 'text-white bg-white/10' : 'text-white/60 hover:text-white hover:bg-white/5') + '"><i class="ri-brain-line text-lg"></i></button>';
        html += '<button onclick="rewindChat(\'' + esc(char.id) + '\')" title="Rebobinar / borrar último" class="w-9 h-9 rounded-lg flex items-center justify-center text-white/60 hover:text-white hover:bg-white/5"><i class="ri-arrow-go-back-line text-lg"></i></button>';
        html += '</div></div>';

        html += '<div class="flex-1 overflow-y-auto"><div class="max-w-2xl mx-auto px-3 sm:px-6 py-6 space-y-5">';
        html += '<div class="text-center pb-4">';
        html += '<img src="' + esc(char.avatar) + '" class="w-16 h-16 rounded-2xl object-cover mx-auto mb-3 border border-white/20" alt="" />';
        html += '<h1 class="font-bold text-lg mb-1">' + esc(char.name) + '</h1>';
        html += '<p class="text-sm text-white/40 mb-3">' + esc(char.description) + '</p>';
        html += '<div class="inline-block text-[10px] font-bold tracking-[0.2em] uppercase text-white/40 border border-white/20 rounded-full px-3 py-1">Secuencia iniciada</div>';
        html += '</div>';

        var userRound = 0;
        chat.forEach(function(msg, idx) {
            if (msg.sender === 'user' && !msg.isHidden) userRound++;
            var isAI = msg.sender === 'ai' && !msg.isTyping;
            var isEnd = idx === chat.length - 1 || chat[idx+1].sender === 'user';
            var showAd = isAI && userRound > 0 && userRound % 10 === 0 && isEnd;

            if (msg.isHidden) {
                html += '<div class="text-center text-[10px] font-bold text-white/30 uppercase tracking-widest my-2">[ Secuencia continuada por el usuario ]</div>';
                return;
            }

            var bubble = '';
            if (msg.sender === 'system') {
                bubble = '<div class="text-center text-[11px] text-red-400/80 border border-red-500/20 rounded-lg py-2 px-3 bg-red-500/5 msg-enter">' + esc(msg.text) + '</div>';
            } else if (msg.sender === 'user') {
                bubble = '<div class="flex justify-end msg-enter"><div class="max-w-[80%] bg-white text-black text-sm leading-relaxed rounded-2xl rounded-tr-sm px-4 py-2.5 whitespace-pre-wrap">' + esc(msg.text) + '</div></div>';
            } else {
                bubble = '<div class="flex gap-2.5 msg-enter">' +
                    '<img src="' + esc(char.avatar) + '" class="w-8 h-8 rounded-full object-cover border border-white/15 mt-0.5" alt="" />' +
                    '<div class="max-w-[80%]"><div class="bg-ventarys-card border border-white/10 text-sm leading-relaxed rounded-2xl rounded-tl-sm px-4 py-2.5 whitespace-pre-wrap">' +
                    (msg.isTyping ? '<div class="flex items-center gap-1.5 py-1"><span class="typing-dot w-1.5 h-1.5 rounded-full bg-white/70" style="animation-delay:.0s"></span><span class="typing-dot w-1.5 h-1.5 rounded-full bg-white/70" style="animation-delay:.15s"></span><span class="typing-dot w-1.5 h-1.5 rounded-full bg-white/70" style="animation-delay:.3s"></span></div>' : esc(msg.text)) +
                    '</div></div></div>';
            }
            html += '<div>' + bubble + '</div>';
            if (showAd) html += renderAdInjector();
        });
        html += '<div id="messagesEnd"></div>';
        html += '</div></div>';

        html += '<div class="border-t border-white/10 bg-black/40 backdrop-blur px-3 sm:px-6 py-3 shrink-0 flex flex-col"><div class="max-w-2xl mx-auto w-full">';
        html += '<div class="flex items-center justify-between mb-2 px-1">';
        var modes = [{id:'normal',label:'Normal',icon:'ri-chat-1-line'},{id:'say',label:'Decir',icon:'ri-speak-line'},{id:'do',label:'Hacer',icon:'ri-run-line'},{id:'story',label:'Historia',icon:'ri-book-open-line'}];
        modes.forEach(function(m) {
            html += '<button onclick="setMode(\'' + m.id + '\')" class="' + cname('flex items-center gap-1 text-[10px] whitespace-nowrap uppercase font-bold px-2.5 py-1 rounded-full transition-colors', state.chatInputMode === m.id ? 'bg-white text-black' : 'bg-ventarys-card text-white/50 border border-white/10 hover:text-white') + '">' +
                '<i class="' + m.icon + ' text-[11px]"></i> ' + esc(m.label) + '</button>';
        });
        html += '<button type="button" onclick="goOn()" class="shrink-0 ml-2 text-[10px] font-bold uppercase flex items-center gap-1 text-white hover:text-black bg-white/10 hover:bg-white px-3 py-1 rounded-full border border-white/10 transition-all shadow-md">Go On <i class="ri-skip-forward-mini-fill text-[11px]"></i></button>';
        html += '</div>';
        html += '<form onsubmit="sendMsg(event)" class="flex items-center gap-2">';
        html += '<div class="flex-1 bg-ventarys-card border border-white/15 rounded-xl focus-within:border-white/40 transition-colors">';
        html += '<textarea id="chatInput" oninput="state.chatInput=this.value" onkeydown="if(event.key===\'Enter\' && !event.shiftKey){event.preventDefault();sendMsg(event);}" placeholder="' + esc(state.chatInputMode === 'normal' ? 'Escribe un mensaje...' : ('Modo activo: ' + state.chatInputMode.toUpperCase())) + '" class="w-full bg-transparent text-sm px-4 py-3 max-h-28 resize-none focus:outline-none placeholder:text-white/30" rows="1"></textarea>';
        html += '</div>';
        html += '<button type="submit" id="sendBtn" disabled class="w-12 h-12 shrink-0 rounded-xl bg-white text-black flex items-center justify-center hover:bg-gray-300 disabled:opacity-30 transition-colors"><i class="ri-arrow-up-line text-xl"></i></button>';
        html += '</form></div></div>';

        html += '</div>';
        return html;
    }

    function getMirrorFromEndpoint(endpoint) {
        if (!endpoint) return 'aihorde';
        if (endpoint.indexOf('aihorde.net') !== -1) return 'aihorde';
        if (endpoint.indexOf('stablehorde.net') !== -1) return 'stablehorde';
        return 'custom';
    }

    function setMirror(mirror) {
        if (mirror === 'aihorde') state.apiSettings.endpoint = 'https://aihorde.net/api/v2/chat/completions';
        else if (mirror === 'stablehorde') state.apiSettings.endpoint = 'https://stablehorde.net/api/v2/chat/completions';
        else state.apiSettings.endpoint = state.apiSettings.endpoint || '';
        render();
    }

                        '<div class="flex items-center gap-3 mb-5">' +
                            '<div class="w-11 h-11 rounded-xl bg-white text-black flex items-center justify-center shrink-0"><i class="ri-terminal-box-line text-xl"></i></div>' +
                            '<div><h2 class="font-bold text-base">SYS.Config</h2><p class="text-xs text-white/40">Conexión LLM (IA Horde - Temperatura bloqueada: 0.3)</p></div>' +
                        '</div>' +
                    '<form onsubmit="saveSettings(event)" class="space-y-4">' +
                        field('Mirror', 'ri-earth-line', '<select onchange="setMirror(this.value)" class="input appearance-none"><option value="aihorde"' + (currentMirror === 'aihorde' ? ' selected' : '') + '>IA Horde</option><option value="stablehorde"' + (currentMirror === 'stablehorde' ? ' selected' : '') + '>Stable Horde</option><option value="custom"' + (currentMirror === 'custom' ? ' selected' : '') + '>Personalizado</option></select><i class="ri-arrow-down-s-line absolute right-3 top-3 text-white/40 pointer-events-none"></i>') +
                        (currentMirror === 'custom' ? field('Endpoint personalizado', 'ri-link', '<input type="text" value="' + esc(s.endpoint) + '" oninput="state.apiSettings.endpoint=this.value" class="input" placeholder="https://..." />') : '') +
                        field('API Key', 'ri-key-2-line', '<div class="relative"><input type="password" value="' + esc(s.apiKey) + '" oninput="state.apiSettings.apiKey=this.value" class="input pr-10" placeholder="***" /><i class="ri-lock-password-line absolute right-3 top-3 text-white/40"></i></div>') +
                        field('Modelo activo', 'ri-cpu-line', '<div class="relative"><select onchange="state.apiSettings.model=this.value" class="input appearance-none"><option value="default">Por defecto (IA Horde)</option><option value="Deliberate">Deliberate (IA Horde)</option><option value="stable_diffusion">Stable Diffusion (IA Horde)</option></select><i class="ri-arrow-down-s-line absolute right-3 top-3 text-white/40 pointer-events-none"></i></div>') +
                        field('Persona de usuario [inyectada en SYS_PROMPT]', 'ri-user-smile-line', '<textarea oninput="state.apiSettings.userPersona=this.value" class="input resize-none" rows="4">' + esc(s.userPersona) + '</textarea>') +
                        '<div class="pt-3 flex items-center justify-between border-t border-white/10">' +
                            '<button type="submit" class="bg-white text-black rounded-full px-6 py-2.5 text-sm font-bold uppercase hover:bg-gray-300 transition-colors flex items-center gap-2"><i class="ri-save-line text-lg"></i> Sobrescribir</button>' +
                            (state.settingsSaved ? '<span class="flex items-center gap-1.5 text-white text-xs font-bold blink"><i class="ri-check-line text-sm"></i> [GUARDADO_OK]</span>' : '') +
                        '</div>' +
                    '</form>' +
                '</div>' +
            '</div>' +
        '</div>';
    }

    function backToHome() { state.view = 'home'; state.activeCharacter = null; render(); }
    function openMemory() {
        var char = state.activeCharacter;
        state.memoryOpenCharId = char.id;
        state.localMemory = state.chatMemories[char.id] || '';
        renderMemoryModal();
    }
    function closeMemory() { var el = document.getElementById('memModal'); if (el) el.remove(); }
    function saveMemory() {
        state.chatMemories = Object.assign({}, state.chatMemories, { [state.memoryOpenCharId]: state.localMemory });
        state.memoryOpenCharId = null;
        closeMemory();
        saveState();
    }
    async function autoSummarize() {
        var char = state.activeCharacter;
        if (!char) return;
        var chat = state.chats[char.id] || [];
        if (chat.length < 2) return alert("Se requiere más conversación para resumir.");
        var history = chat.slice(-25).filter(function(m) { return !m.isHidden; });
        var payload = [{ role: 'system', content: 'Eres un asistente analizador de roleplay. Escribe un resumen compacto (máx 200 palabras) de la historia hasta ahora usando viñetas. Incluye detalles clave, el estado de la relación y los últimos eventos ocurridos. Sé directo y objetivo.' }].concat(history.map(function(m) { return { role: m.sender === 'user' ? 'user' : 'assistant', content: m.text }; }));
        var apiKey = state.apiSettings.apiKey || '0000000000';
        var isHorde = state.apiSettings.endpoint.indexOf('aihorde.net') !== -1 || state.apiSettings.endpoint.indexOf('stablehorde.net') !== -1;
        var headers = { 'Content-Type': 'application/json' };
        if (isHorde) { headers['apikey'] = apiKey; } else { if (state.apiSettings.apiKey) headers['Authorization'] = 'Bearer ' + state.apiSettings.apiKey; }
        try {
            var response = await fetch(state.apiSettings.endpoint, {
                method: 'POST',
                headers: headers,
                body: JSON.stringify({ model: state.apiSettings.model || 'default', messages: payload, temperature: 0.3 })
            });
            if (!response.ok) throw new Error("API Falló");
            var data = await response.json();
            state.localMemory = data.choices[0].message.content;
            var memInput = document.getElementById('memInput');
            if (memInput) memInput.value = state.localMemory;
        } catch (e) { alert("Error al generar resumen: " + e.message); }
    }
    function sendMsg(e) {
        e.preventDefault();
        if (!state.chatInput.trim()) return;
        var formatted = state.chatInput;
        if (state.chatInputMode === 'say') formatted = '[Dice]: "' + state.chatInput + '"';
        else if (state.chatInputMode === 'do') formatted = '[Acción]: *' + state.chatInput + '*';
        else if (state.chatInputMode === 'story') formatted = '[Narrativa]: ' + state.chatInput;
        sendMessage(formatted, false, state.chatInput);
        state.chatInput = '';
        render();
        setTimeout(scrollEnd, 100);
    }
    function goOn() {
        sendMessage("(Continúa la respuesta anterior desde donde te quedaste, sin repetir lo que ya dijiste)", true, "(Continúa...)");
        render();
        setTimeout(scrollEnd, 100);
    }
    function setMode(m) { state.chatInputMode = m; render(); }
    function setCat(c) { state.activeCategory = c; render(); }
    function updateForm(input) {
        if (!state.formData) state.formData = {};
        state.formData[input.name] = input.value;
    }
    function createCharSubmit(e) {
        e.preventDefault();
        var fd = state.formData;
        var newChar = { id: 'char_' + Date.now(), ...fd, banner: fd.avatar, tags: fd.tags.split(',').map(function(t) { return t.trim(); }).filter(function(t) { return t; }), tokens: '0', msgCount: '0' };
        var issueTitle = encodeURIComponent('Nuevo Personaje: ' + newChar.name);
        var issueBody = encodeURIComponent('Por favor añade este personaje al archivo `chars.json`:\n\n```json\n' + JSON.stringify(newChar, null, 2) + '\n```');
        window.open('https://github.com/Juanoto2012/VentarysRP/issues/new?title=' + issueTitle + '&body=' + issueBody, '_blank');
    }
    function saveSettings(e) {
        e.preventDefault();
        state.settingsSaved = true;
        setTimeout(function() { state.settingsSaved = false; render(); }, 3000);
        render();
    }

    function openCharById(btn) {
        var charId = btn.getAttribute('data-char-id');
        var char = state.characters.find(function(c) { return c.id === charId; });
        if (char) openChat(char);
    }

    function renderMemoryModal() {
        var charId = state.memoryOpenCharId;
        var modal = '<div id="memModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">' +
            '<div class="bg-ventarys-panel border border-white/10 rounded-2xl w-full max-w-lg p-5 flex flex-col shadow-2xl">' +
                '<div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg flex items-center gap-2"><i class="ri-brain-line"></i> Memoria del Chat</h3>' +
                '<button onclick="closeMemory()" class="text-white/50 hover:text-white"><i class="ri-close-line text-xl"></i></button></div>' +
                '<p class="text-xs text-white/50 mb-4 leading-relaxed">Sistema tipo Janitor AI. Define un resumen para que la IA nunca pierda el contexto actual. Se inyectará permanentemente en el Prompt del Sistema.</p>' +
                '<textarea id="memInput" oninput="state.localMemory=this.value" class="w-full bg-ventarys-card border border-white/10 rounded-xl p-3 text-sm h-48 mb-5 focus:outline-none focus:border-white/40 resize-none text-white/80" placeholder="- Entorno actual: Bosque oscuro&#10;- Dinámica: {{char}} desconfía del usuario pero lo protege.&#10;- Eventos recientes: Fueron atacados por bandidos y escaparon.">' + esc(state.localMemory) + '</textarea>' +
                '<div class="flex justify-between items-center">' +
                    '<button onclick="autoSummarize()" class="text-xs font-bold uppercase tracking-wider bg-ventarys-card hover:bg-white/10 px-4 py-2.5 rounded-lg border border-white/10 transition-colors flex items-center gap-2"><i class="ri-magic-line"></i> Auto-Resumen</button>' +
                    '<button onclick="saveMemory()" class="text-xs font-bold uppercase tracking-wider bg-white text-black px-6 py-2.5 rounded-lg hover:bg-gray-200 transition-colors flex items-center gap-1.5"><i class="ri-save-line text-sm"></i> Guardar</button>' +
                '</div>' +
            '</div></div>';
        var existing = document.getElementById('memModal');
        if (existing) existing.remove();
        var wrapper = document.createElement('div');
        wrapper.innerHTML = modal;
        document.body.appendChild(wrapper.firstElementChild);
    }

    async function loadCharacters() {
        try {
            var ts = new Date().getTime();
            var url = 'https://raw.githubusercontent.com/Juanoto2012/VentarysRP/main/chars.json?t=' + ts;
            var res = await fetch(url);
            if (!res.ok) throw new Error("No se pudo cargar la base de datos (Error 404)");
            var data = await res.json();
            if (Array.isArray(data) && data.length > 0) state.characters = data;
            else throw new Error("Base de datos vacía");
        } catch (err) {
            console.error(err.message);
            state.characters = fallbackCharacters;
        } finally {
            state.loadingChars = false;
            render();
        }
    }

    function checkAdBlock() {
        var dummy = document.createElement('div');
        dummy.className = 'ad-zone ad-space banner-ads textads';
        document.body.appendChild(dummy);
        setTimeout(function() {
            var style = window.getComputedStyle(dummy);
            if (style.display === 'none' || dummy.offsetHeight === 0) state.adBlockDetected = true;
            dummy.remove();
            render();
        }, 1000);
    }

    setTimeout(checkAdBlock, 2000);
    loadCharacters();
    </script>
